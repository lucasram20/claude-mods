name: Publish to npm

# Runs when a GitHub release is published. The release tag must match the version
# in statusline/package.json (tag v0.1.0 for version 0.1.0).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm attach a provenance statement to the package

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statusline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: statusline/package-lock.json

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match package.json version '$version'."
            exit 1
          fi

      - run: npm ci

      - name: Type check and test
        run: npm run check

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
