name: Release

# Every push to main runs the full test matrix first. Only if it passes does semantic-release
# look at the commit messages and, when there is something to release, publish to npm and
# create the GitHub release. The file name matters: npm's trusted publisher is tied to it.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm trusted publishing (no token needed) and provenance
      issues: write
      pull-requests: write
    defaults:
      run:
        working-directory: statusline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads the whole history and tags

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: statusline/package-lock.json

      - run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
