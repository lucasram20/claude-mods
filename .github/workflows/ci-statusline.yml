name: CI / statusline

# Tests the statusline. Runs on pull requests that touch it, and is called by publish.yml before every release.
on:
  pull_request:
    paths: [statusline/**, .github/workflows/ci-statusline.yml]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: statusline
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: statusline/package-lock.json

      - run: npm ci

      - name: Type check and test
        run: npm run check

      - name: Build
        run: npm run build

      # Installs the built package into a throwaway Claude config folder, runs the
      # installed status line, then removes it again.
      - name: Smoke test the installer
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          node dist/installer/cli.js --yes
          test -f "$CLAUDE_CONFIG_DIR/settings.json"
          line="$(echo '{"model":{"display_name":"Opus"},"context_window":{"used_percentage":40}}' \
            | node "$CLAUDE_CONFIG_DIR/claude-mods-statusline/runtime/main.js")"
          echo "$line"
          echo "$line" | grep -q Opus
          node dist/installer/cli.js --uninstall --yes
          test ! -d "$CLAUDE_CONFIG_DIR/claude-mods-statusline"

      - name: Check the package contents
        run: npm pack --dry-run
